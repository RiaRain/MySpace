<!doctype html><html lang=ru><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#f4f2fa><title>My Space</title><script defer src=/MySpace/js/bundle.js></script></head><body><nav id=nav></nav><div class=wrap><div id=p-home><header><div><h1>My<span> Space</span></h1><div class=mut><span id=greet title="Изменить имя" style=cursor:pointer></span> · <span id=today></span></div><div class=mut id=quote></div></div><div class=row><button class=btn id=exp>⬇ Экспорт</button><button class=btn id=imp>⬆ Импорт</button><input id=file type=file accept=.json hidden></div></header><section class="card full" style=margin-bottom:16px><h2>Прогресс дня<span class=mut id=catMsg></span></h2><div class=track><img class=path src=assets/path.png alt onerror="this.style.display='none'"><div class=cat id=cat><img src=assets/images/cat.png alt=кот onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class=ph></div></div><div class=yarn><img src=assets/images/house.png alt=домик onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class=ph></div></div></div><div class=bar><i id=bar></i></div><div class=stats id=gstats></div><div class=mut style=margin-top:6px>+1 балл за задачу (один раз), +5 за закрытый день (один раз на дату).</div></section><section class=card style=margin-bottom:16px><h2>Старт дня<span class=mut id=sodDate></span></h2><div class=sod><div><div class=mut>Настроение</div><div class=pick id=mood></div></div><div><div class=mut>Энергия</div><div class=pick id=energy></div></div><label class=mut>Моё главное дело сегодня<input id=main placeholder="Что сегодня приблизит тебя к мечте?"></label></div></section><div class=grid><section class=card><div class="row sp" style=margin-bottom:10px><button class=ib id=prev>◀</button><span class=mt id=mTitle></span><button class=ib id=next>▶</button></div><div class=cal id=cal></div><div class="row sp" style=margin-top:10px><button class=btn id=goToday>Сегодня</button><button class=btn id=dayOverview title="Обзор выбранного дня"><span>👁</span> Обзор дня</button><span class=mut><i style=color:var(--ac)>●</i> задачи<i style=color:#e58fb0>●</i> заметки</span></div></section><section class=card><div class="row sp"><h2 id=dTitle style=margin:0></h2><div class=row><button class=btn id=catMgr>🏷 Категории</button><button class="btn pri" id=addT>+ Задача</button></div></div><div class=mut id=dMain style=margin-top:4px></div><div class=chips id=filter></div><ul id=tasks></ul></section><section class=card id=timer></section><section class=card><h2>Время в фокусе за неделю</h2><div id=week></div></section><section class=card><h2>Заметки дня</h2><textarea id=nText placeholder="Новая заметка…"></textarea><button class="btn pri" id=nAdd style=margin-top:6px>Добавить</button><div id=notes></div></section><section class=card><div class="row sp"><h2 style=margin:0>Привычки</h2><div class=row><button class=btn id=hStats>Статистика</button><button class=btn id=hAdd>+ Привычка</button></div></div><div id=habits></div></section><section class="card full"><h2>Итог дня</h2><div class=stats id=rStats style=margin-bottom:12px></div><div class=grid><label class=mut>Что сегодня получилось?<textarea id=rGood></textarea></label><label class=mut>Что нужно перенести или сделать завтра?<textarea id=rNext></textarea></label></div></section></div></div><main id=pg hidden></main></div><dialog id=dlg></dialog><div id=toast></div></body></html>
